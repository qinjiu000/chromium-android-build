name: CPython Android prototype

# NOTE: workflow_dispatch only works once this file exists on the default
# branch (GitHub API restriction). Until then, the push trigger below runs
# the prototype on this scratch branch; keep it scoped to this branch and
# to the prototype paths so no other push ever triggers it.
on:
  workflow_dispatch:
  push:
    branches: [scratch/cpython-prototype]
    paths:
      - prototypes/cpython/**
      - .github/workflows/python-prototype.yml

jobs:
  proto-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download NDK r30
        run: |
          mkdir -p "$TMPDIR" "$GITHUB_WORKSPACE/ndk"
          curl -fL https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            -o "$TMPDIR/android-ndk-r30-linux.zip"
          unzip -q "$TMPDIR/android-ndk-r30-linux.zip" -d "$GITHUB_WORKSPACE/ndk"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/ndk/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Fetch CPython and build x86_64 artifacts
        run: |
          mkdir -p "$TMPDIR"
          prototypes/cpython/fetch_python.sh
          prototypes/cpython/build.sh "$ANDROID_NDK_HOME" \
            prototypes/cpython/unpacked/x86_64 x86_64
      - name: Run on x86_64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            set -euo pipefail
            remote=/data/local/tmp/pyproto
            abi=x86_64
            chaquopy=prototypes/cpython/unpacked/$abi
            adb shell mkdir -p "$remote/lib-dynload"
            adb push "prototypes/cpython/out/$abi/pyproto-$abi" "$remote/"
            adb push "prototypes/cpython/out/$abi/pyhello.cpython-313-x86_64-linux-android.so" "$remote/"
            adb push "$chaquopy/jniLibs/$abi/"*.so "$remote/"
            adb push "$chaquopy/lib-dynload/$abi" "$remote/lib-dynload/"
            adb push "$chaquopy/stdlib" "$remote/"
            adb push prototypes/cpython/run_tests.py "$remote/"
            adb shell chmod 755 "$remote/pyproto-$abi"
            output="$(adb shell "LD_LIBRARY_PATH=$remote $remote/pyproto-$abi $remote $abi" 2>&1)" || {
              printf '%s\n' "$output"
              exit 1
            }
            printf '%s\n' "$output"
            grep -Fq 'PROTOTYPE OK' <<<"$output"

  proto-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download NDK r30
        run: |
          mkdir -p "$TMPDIR" "$GITHUB_WORKSPACE/ndk"
          curl -fL https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            -o "$TMPDIR/android-ndk-r30-linux.zip"
          unzip -q "$TMPDIR/android-ndk-r30-linux.zip" -d "$GITHUB_WORKSPACE/ndk"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/ndk/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Fetch CPython and build arm64-v8a artifacts
        run: |
          mkdir -p "$TMPDIR"
          prototypes/cpython/fetch_python.sh
          prototypes/cpython/build.sh "$ANDROID_NDK_HOME" \
            prototypes/cpython/unpacked/arm64-v8a arm64-v8a
      - name: Run on arm64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          emulator-boot-timeout: 1800
          script: |
            set -euo pipefail
            remote=/data/local/tmp/pyproto
            abi=arm64-v8a
            chaquopy=prototypes/cpython/unpacked/$abi
            adb shell mkdir -p "$remote/lib-dynload"
            adb push "prototypes/cpython/out/$abi/pyproto-$abi" "$remote/"
            adb push "prototypes/cpython/out/$abi/pyhello.cpython-313-aarch64-linux-android.so" "$remote/"
            adb push "$chaquopy/jniLibs/$abi/"*.so "$remote/"
            adb push "$chaquopy/lib-dynload/$abi" "$remote/lib-dynload/"
            adb push "$chaquopy/stdlib" "$remote/"
            adb push prototypes/cpython/run_tests.py "$remote/"
            adb shell chmod 755 "$remote/pyproto-$abi"
            output="$(adb shell "LD_LIBRARY_PATH=$remote $remote/pyproto-$abi $remote $abi" 2>&1)" || {
              printf '%s\n' "$output"
              exit 1
            }
            printf '%s\n' "$output"
            grep -Fq 'PROTOTYPE OK' <<<"$output"
