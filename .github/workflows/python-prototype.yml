name: CPython Android prototype

# NOTE: workflow_dispatch only works once this file exists on the default
# branch (GitHub API restriction). Until then, the push trigger below runs
# the prototype on this scratch branch; keep it scoped to this branch and
# to the prototype paths so no other push ever triggers it.
on:
  workflow_dispatch:
  push:
    branches: [scratch/cpython-prototype]
    paths:
      - prototypes/cpython/**
      - .github/workflows/python-prototype.yml

jobs:
  proto-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download NDK r30
        run: |
          mkdir -p "$TMPDIR" "$GITHUB_WORKSPACE/ndk"
          curl -fL https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            -o "$TMPDIR/android-ndk-r30-linux.zip"
          unzip -q "$TMPDIR/android-ndk-r30-linux.zip" -d "$GITHUB_WORKSPACE/ndk"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/ndk/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Fetch CPython and build x86_64 artifacts
        run: |
          mkdir -p "$TMPDIR"
          prototypes/cpython/fetch_python.sh
          prototypes/cpython/build.sh "$ANDROID_NDK_HOME" \
            prototypes/cpython/unpacked/x86_64 x86_64
      - name: Run on x86_64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: prototypes/cpython/run_on_emulator.sh x86_64

  # NOTE: there is deliberately NO arm64 emulator job. Two rounds proved an
  # arm64-v8a emulator does not boot on x86_64 GitHub runners: API 34
  # (run 44831624898) and API 30 with 4 cores / 4 GB RAM / 2400 s boot
  # timeout (run 44836441687) both ended with "Timeout waiting for emulator
  # to boot" — adb never saw the device. An ARM64 runner is not an escape
  # hatch either: the Android emulator SDK package ships only x86_64 host
  # binaries (emulator-linux_x64-*.zip, verified in repository2-1.xml) and
  # NDK r30 has no linux-aarch64 toolchain. Literal arm64 execution is
  # therefore deferred to real hardware (the user's phone); what CI proves
  # for arm64 is that the artifacts build correctly (this job) plus the
  # local readelf verification recorded in the README.
  proto-arm64-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/tmp
    steps:
      - uses: actions/checkout@v4
      - name: Download NDK r30
        run: |
          mkdir -p "$TMPDIR" "$GITHUB_WORKSPACE/ndk"
          curl -fL https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            -o "$TMPDIR/android-ndk-r30-linux.zip"
          unzip -q "$TMPDIR/android-ndk-r30-linux.zip" -d "$GITHUB_WORKSPACE/ndk"
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/ndk/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Fetch CPython and build arm64-v8a artifacts
        run: |
          mkdir -p "$TMPDIR"
          prototypes/cpython/fetch_python.sh
          prototypes/cpython/build.sh "$ANDROID_NDK_HOME" \
            prototypes/cpython/unpacked/arm64-v8a arm64-v8a
